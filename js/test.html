<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Test Popup</title>
<style>
#popupForm {
  display: none;
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: yellow;
  padding: 20px;
  border: 2px solid black;
}
.close {
  position: absolute;
  top: 5px;
  right: 8px;
  cursor: pointer;
}
</style>
</head>
<body>

<button id="cancelPopUp">Infos Islande</button>

<div id="popupForm">
  <span class="close" id="closePopUp">&times;</span>
  <h3>Popup Test</h3>
  <p>Si tu vois ce texte, le popup fonctionne.</p>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const openPopUp = document.getElementById('cancelPopUp');
  const popupForm = document.getElementById('popupForm');
  const closePopUp = document.getElementById('closePopUp');

  openPopUp.addEventListener('click', () => {
    popupForm.style.display = 'block';
  });

  closePopUp.addEventListener('click', () => {
    popupForm.style.display = 'none';
  });
});
</script>

</body>
</html>
